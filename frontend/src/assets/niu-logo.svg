<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006837" />
      <stop offset="100%" stop-color="#004724" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="goldBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Laurel Leaves Bottom Wreath -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M 170 330 C 130 310, 110 260, 100 230 C 105 245, 125 295, 175 320 Z" />
    <path d="M 330 330 C 370 310, 390 260, 400 230 C 395 245, 375 295, 325 320 Z" />
    <!-- Leaf Clusters Left -->
    <path d="M 125 240 Q 100 230 110 215 Q 125 225 130 240 Z" />
    <path d="M 140 265 Q 115 260 120 240 Q 138 250 145 265 Z" />
    <path d="M 160 290 Q 135 290 140 270 Q 158 278 165 290 Z" />
    <path d="M 185 310 Q 160 315 165 295 Q 183 300 190 310 Z" />
    <path d="M 215 325 Q 190 335 195 315 Q 212 318 220 325 Z" />
    <!-- Leaf Clusters Right -->
    <path d="M 375 240 Q 400 230 390 215 Q 375 225 370 240 Z" />
    <path d="M 360 265 Q 385 260 380 240 Q 362 250 355 265 Z" />
    <path d="M 340 290 Q 365 290 360 270 Q 342 278 335 290 Z" />
    <path d="M 315 310 Q 340 315 335 295 Q 317 300 310 310 Z" />
    <path d="M 285 325 Q 310 335 305 315 Q 288 318 280 325 Z" />
  </g>

  <!-- Main Shield Outer Gold Border -->
  <path d="M 250 35 C 330 35, 380 50, 390 90 C 390 190, 350 280, 250 330 C 150 280, 110 190, 110 90 C 120 50, 170 35, 250 35 Z" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Main Shield Inner Green -->
  <path d="M 250 44 C 323 44, 370 57, 379 93 C 379 184, 342 268, 250 316 C 158 268, 121 184, 121 93 C 130 57, 177 44, 250 44 Z" fill="url(#shieldGrad)" />

  <!-- Sun Rays & Emblem in Upper Shield -->
  <g transform="translate(250, 140)">
    <!-- Sun Core -->
    <circle cx="0" cy="-5" r="22" fill="url(#goldGrad)" />
    <!-- Rays -->
    <path d="M 0 -5 L -8 -60 L 0 -68 L 8 -60 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L -26 -55 L -16 -60 L -10 -50 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L 10 -50 L 16 -60 L 26 -55 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L -42 -42 L -34 -50 L -25 -38 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L 25 -38 L 34 -50 L 42 -42 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L -54 -24 L -48 -34 L -36 -20 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L 36 -20 L 48 -34 L 54 -24 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L -60 -4 L -56 -16 L -42 -5 Z" fill="url(#goldGrad)" />
    <path d="M 0 -5 L 42 -5 L 56 -16 L 60 -4 Z" fill="url(#goldGrad)" />
    <!-- Waves beneath sun -->
    <path d="M -45 18 Q -30 10 -15 18 Q 0 26 15 18 Q 30 10 45 18 L 45 23 Q 30 15 15 23 Q 0 31 -15 23 Q -30 15 -45 23 Z" fill="url(#goldGrad)" />
    <path d="M -40 28 Q -26 20 -13 28 Q 0 36 13 28 Q 26 20 40 28 L 40 33 Q 26 25 13 33 Q 0 41 -13 33 Q -26 25 -40 33 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Banner across Shield -->
  <g filter="url(#shadow)">
    <!-- Banner Ribbons Left & Right Ends -->
    <path d="M 90 215 L 125 190 L 125 235 L 90 245 L 105 230 Z" fill="#B45309" />
    <path d="M 410 215 L 375 190 L 375 235 L 410 245 L 395 230 Z" fill="#B45309" />
    <!-- Central Ribbon Curve -->
    <path d="M 110 200 Q 250 240 390 200 L 395 235 Q 250 275 105 235 Z" fill="url(#goldBannerGrad)" stroke="#B45309" stroke-width="1.5" />
    <!-- Banner Text -->
    <text x="160" y="222" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="14" fill="#1C1917" letter-spacing="1.5">COURAGE</text>
    <circle cx="218" cy="217" r="2" fill="#1C1917" />
    <text x="228" y="222" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="14" fill="#1C1917" letter-spacing="1.5">INTEGRITY</text>
    <circle cx="298" cy="217" r="2" fill="#1C1917" />
    <text x="308" y="222" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="14" fill="#1C1917" letter-spacing="1.5">HONOUR</text>
  </g>

  <!-- NIU Text inside bottom tip of shield -->
  <text x="250" y="292" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="34" fill="url(#goldGrad)" letter-spacing="4">NIU</text>

  <!-- Subtitle Typography: NOIDA INTERNATIONAL UNIVERSITY -->
  <g text-anchor="middle">
    <text x="250" y="395" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="36" fill="#006837" letter-spacing="3">NOIDA</text>
    <text x="250" y="430" font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="22" fill="#006837" letter-spacing="6">INTERNATIONAL</text>
    <text x="250" y="465" font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="26" fill="#006837" letter-spacing="8">UNIVERSITY</text>
  </g>
</svg>
