# Ollama Models
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:0.5b
spring.ai.ollama.options.temperature = 0
spring.ai.ollama.options.repeat-penalty=1.1
spring.ai.ollama.embedding.options.model=bge-m3:latest

# PGVector Vector Store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=ivfflat
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.table-name=vector_store_1024
spring.ai.vectorstore.pgvector.dimensions=1024


# Unstructured API RAG Extraction Config
unstructured.api.url=http://localhost:8000/general/v1/process
unstructured.api.strategy=hi_res
unstructured.enabled=true
unstructured.max-rows-per-chunk=10

# Multipart File Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JPA Hibernate Config
spring.jpa.properties.hibernate.id.db_structure_naming=legacy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

