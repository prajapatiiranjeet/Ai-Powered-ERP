spring.application.name=mycode
#
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=asdfghjkl
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=phi4-mini:latest
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=768

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# PostgreSQL ke liye sequence strategy fix
spring.jpa.properties.hibernate.id.db_structure_naming=legacy
spring.jpa.hibernate.ddl-auto=update

# Ya seedha dialect set karo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
